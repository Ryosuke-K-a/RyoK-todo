<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TODO</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>TODO</h1>

    <div class="input-area">
      <input
        id="new-todo"
        type="text"
        placeholder="新しいタスクを入力..."
        autocomplete="off"
      />
      <button id="add-btn">追加</button>
    </div>

    <div class="card">
      <ul id="todo-list" class="todo-list"></ul>

      <div class="footer">
        <span id="count" class="count">0 件残り</span>

        <div class="filters">
          <button class="active" data-filter="all">すべて</button>
          <button data-filter="active">未完了</button>
          <button data-filter="completed">完了済み</button>
        </div>

        <button id="clear-btn" class="clear-btn" disabled>完了済みを削除</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
